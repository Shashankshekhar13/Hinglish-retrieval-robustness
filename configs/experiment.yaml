seed: 42

datasets:
  scifact: null
  nfcorpus: null
  arguana: 300
  fiqa: 300
  scidocs: 300

retrievers:
  - bm25
  - minilm
  - e5small
  - bgem3

models:
  minilm: sentence-transformers/all-MiniLM-L12-v2
  e5small: intfloat/multilingual-e5-small
  bgem3: BAAI/bge-m3

device: auto

batch_size:
  minilm: 64
  e5small: 64
  bgem3: 16

groq:
  gen_model: qwen/qwen3.8-27b
  translate_model: openai/gpt-oss-20b
  rpm: 20
  max_retries: 3
  prompt_version: v3
  min_mix: 0.25

max_tokens:
  scifact: 600
  nfcorpus: 600
  arguana: 3000
  fiqa: 600
  scidocs: 600

noise_levels:
  - 0.25
  - 0.5

top_k: 100
